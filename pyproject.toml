[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-local-clipping"
version = "0.1.0"
description = "CLI local que genera clips para redes sociales con Whisper y Ollama"
requires-python = ">=3.10"
dependencies = ["openai-whisper>=20240930", "opencv-python-headless>=4.8"]

[project.optional-dependencies]
faster = ["faster-whisper>=1.0.0"]

[project.scripts]
clips = "clipper.cli:main"

[tool.setuptools]
packages = ["clipper"]

[tool.ruff]
target-version = "py310"
line-length = 110
